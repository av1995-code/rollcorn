<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'inline-speculation-rules'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}/{{path}}">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}/{{path}}">
<meta property="og:image" content="{{url}}/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The {{name}} mark: an ear of corn with its husk rolled around it into a wheel, on gold.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v={{css}}">
<script src="site.js?v={{js}}" defer></script>
<script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
</head>
<body id="top">
<a class="skip" href="{{skip_href}}">{{skip_text}}</a>

<!-- Drawn once, used all over. The logo's O is an ear of corn with its husk rolled around it into a wheel.
     The rest are the markings of each sport's own field, seen from above: plain line drawings, no one's logo. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="kernels" width="12.6" height="21" patternUnits="userSpaceOnUse" x="-6.3" y="-44">
      <rect x="1.1" y="1.1" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
      <rect x="-5.2" y="11.6" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
      <rect x="7.4" y="11.6" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
    </pattern>
    <symbol id="ear" viewBox="0 0 120 120">
      <path d="M39 103 L31 115" stroke="#000" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(62 58) rotate(30)">
        <path d="M0 -43 C12 -43 19.5 -23 19.5 2 C19.5 26 13 42 0 42 C-13 42 -19.5 26 -19.5 2 C-19.5 -23 -12 -43 0 -43Z" fill="#000"/>
        <path d="M0 -43 C12 -43 19.5 -23 19.5 2 C19.5 26 13 42 0 42 C-13 42 -19.5 26 -19.5 2 C-19.5 -23 -12 -43 0 -43Z" fill="url(#kernels)" stroke="#000" stroke-width="4.5"/>
      </g>
      <g stroke="#000" stroke-width="4.5" stroke-linejoin="round">
        <path d="M32 108.5 A56 56 0 0 0 112.6 40.8 A59.6 59.6 0 0 1 45.8 95.2Z" fill="#22753A"/>
        <path d="M40.8 112.6 A56 56 0 1 1 88 11.5 A50.3 50.3 0 0 0 37.1 92.8Z" fill="#3FA34D"/>
      </g>
    </symbol>
    <symbol id="turf-football" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M0 16H400M0 184H400" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M40 16V184M80 16V184M120 16V184M160 16V184M200 16V184M240 16V184M280 16V184M320 16V184M360 16V184" vector-effect="non-scaling-stroke"/>
        <path d="M7.5 20H400M7.5 180H400" stroke-width="5" stroke-dasharray="1 7"/>
        <path d="M7.5 79H400M7.5 121H400" stroke-width="7" stroke-dasharray="1 7"/>
      </g>
    </symbol>
    <symbol id="turf-basketball" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M60 6H394V194H60" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M394 62H282V138H394M282 62A38 38 0 0 0 282 138M378 82V118M60 60A40 40 0 0 1 60 140" vector-effect="non-scaling-stroke"/>
        <path d="M282 62A38 38 0 0 1 282 138" stroke-dasharray="6 6" vector-effect="non-scaling-stroke"/>
        <path d="M394 20H352A118 118 0 0 0 352 180H394M330 62v-6M312 62v-6M330 138v6M312 138v6" vector-effect="non-scaling-stroke"/>
        <circle cx="368" cy="100" r="8" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
    <symbol id="turf-wrestling" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M150 -30V230" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <circle cx="290" cy="100" r="112" vector-effect="non-scaling-stroke"/>
        <circle cx="290" cy="100" r="92" stroke-dasharray="2 8" vector-effect="non-scaling-stroke"/>
        <circle cx="290" cy="100" r="30" vector-effect="non-scaling-stroke"/>
        <path d="M280 86V114M300 86V114" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
    <symbol id="turf-volleyball" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M70 26H390V174H70Z" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M230 12V188" stroke-width="4" vector-effect="non-scaling-stroke"/>
        <path d="M177 26V174M283 26V174" vector-effect="non-scaling-stroke"/>
        <path d="M177 12V26M177 174V188M283 12V26M283 174V188" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
    <symbol id="turf-diamond" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M280 214L130 64M280 214L430 64" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M280 190L206 116L280 42L354 116ZM168 102A158 158 0 0 1 392 102" vector-effect="non-scaling-stroke"/>
        <path d="M76 10A290 290 0 0 1 484 10" stroke-dasharray="2 8" vector-effect="non-scaling-stroke"/>
        <circle cx="280" cy="122" r="13" vector-effect="non-scaling-stroke"/>
        <path d="M274 36h12v12h-12zM200 110h12v12h-12zM348 110h12v12h-12zM272 184h16v8l-8 7l-8-7z" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
    <symbol id="turf-track" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M40 14H300A86 86 0 0 1 300 186H40M40 78H300A22 22 0 0 1 300 122H40" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M40 30H300A70 70 0 0 1 300 170H40M40 46H300A54 54 0 0 1 300 154H40M40 62H300A38 38 0 0 1 300 138H40" vector-effect="non-scaling-stroke"/>
        <path d="M120 14V30M132 30V46M144 46V62M156 62V78" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
    <symbol id="turf-uprights" viewBox="0 0 400 200" preserveAspectRatio="xMaxYMid slice">
      <g fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M300 200V128M262 128H338M262 128V22M338 128V22" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <path d="M60 196C120 40 220 -6 300 62" stroke-dasharray="2 9" stroke-linecap="round" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <ellipse cx="300" cy="62" rx="13" ry="8" transform="rotate(-28 300 62)" vector-effect="non-scaling-stroke"/>
        <path d="M0 196H400" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="top-inner">
    <{{brand_tag}} class="wordmark"><a class="wordmark-link" href="{{home}}"><span class="word">R<span class="visually-hidden">o</span><svg class="ear" viewBox="0 0 120 120" aria-hidden="true"><use href="#ear"/></svg>ll</span> <span class="word">C<span class="visually-hidden">o</span><svg class="ear" viewBox="0 0 120 120" aria-hidden="true"><use href="#ear"/></svg>rn</span></a></{{brand_tag}}>
    <p class="tagline">{{tagline}}</p>
    {{aside}}
    {{search}}
  </div>
</header>

<nav class="jump" aria-label="Site">
  <div class="jump-inner">
    <a class="jump-home" href="{{home}}" aria-label="{{home_label}}"><svg class="ear" viewBox="0 0 120 120" aria-hidden="true"><use href="#ear"/></svg></a>
    <div class="jump-sports">{{nav}}</div>
    <a class="jump-play" href="hang-time.html"{{game_current}}>Play</a>
  </div>
</nav>

{{main}}

<a class="totop" href="#top">Top</a>
{{data}}

<footer class="foot">
  <div class="foot-inner">
    <a class="foot-mark" href="{{home}}" aria-label="{{home_label}}"><svg class="ear" viewBox="0 0 120 120" aria-hidden="true"><use href="#ear"/></svg></a>
    <nav class="foot-nav" aria-label="All pages">{{foot_nav}}</nav>
    <div class="foot-notes">
{{footer}}
    </div>
  </div>
</footer>
</body>
</html>
