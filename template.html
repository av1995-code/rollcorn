<!-- The logo's O: an ear of corn with its husk rolled around it into a wheel. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="kernels" width="12.6" height="21" patternUnits="userSpaceOnUse" x="-6.3" y="-44">
      <rect x="1.1" y="1.1" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
      <rect x="-5.2" y="11.6" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
      <rect x="7.4" y="11.6" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
    </pattern>
    <symbol id="ear" viewBox="0 0 120 120">
      <path d="M39 103 L31 115" stroke="#000" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(62 58) rotate(30)">
        <path d="M0 -43 C12 -43 19.5 -23 19.5 2 C19.5 26 13 42 0 42 C-13 42 -19.5 26 -19.5 2 C-19.5 -23 -12 -43 0 -43Z" fill="#000"/>
        <path d="M0 -43 C12 -43 19.5 -23 19.5 2 C19.5 26 13 42 0 42 C-13 42 -19.5 26 -19.5 2 C-19.5 -23 -12 -43 0 -43Z" fill="url(#kernels)" stroke="#000" stroke-width="4.5"/>
      </g>
      <g stroke="#000" stroke-width="4.5" stroke-linejoin="round">
        <path d="M32 108.5 A56 56 0 0 0 112.6 40.8 A59.6 59.6 0 0 1 45.8 95.2Z" fill="#22753A"/>
        <path d="M40.8 112.6 A56 56 0 1 1 88 11.5 A50.3 50.3 0 0 0 37.1 92.8Z" fill="#3FA34D"/>
      </g>
    </symbol>
  </defs>
</svg>

<header class="masthead">
  <div class="masthead-sign">
    <h1 class="wordmark" aria-label="{{name}}"><a class="wordmark-link" href="{{home}}" aria-hidden="true" tabindex="-1"><span class="word">R<svg class="ear" viewBox="0 0 120 120"><use href="#ear"/></svg>LL</span> <span class="word">C<svg class="ear" viewBox="0 0 120 120"><use href="#ear"/></svg>RN</span></a></h1>
    <p class="tagline">{{tagline}}</p>
    {{aside}}
  </div>
</header>

<nav class="jump" aria-label="Sections">
  <div class="jump-inner">
    <a class="jump-home" href="{{home}}" aria-label="{{home_label}}"><svg class="ear" viewBox="0 0 120 120" aria-hidden="true"><use href="#ear"/></svg></a>
    <div class="jump-sports">{{nav}}</div>
    <a class="jump-merch" href="merch.html"{{merch_current}}>Merch</a>
  </div>
</nav>

{{main}}

<footer class="foot">
{{footer}}
</footer>

<script>
// Times: "3 hours ago" under headlines, "3h" in the Just in column.
(function () {
  var long = window.Intl && Intl.RelativeTimeFormat
    ? new Intl.RelativeTimeFormat("en", { numeric: "auto" }) : null;
  var steps = [["day", 86400, "d"], ["hour", 3600, "h"], ["minute", 60, "m"]];
  function refresh() {
    document.querySelectorAll("time[datetime]").forEach(function (el) {
      var secs = (Date.now() - new Date(el.dateTime)) / 1000;
      if (!el.title) el.title = el.textContent;
      for (var i = 0; i < steps.length; i++) {
        if (secs >= steps[i][1] || i === steps.length - 1) {
          var n = Math.max(0, Math.round(secs / steps[i][1]));
          if (el.hasAttribute("data-short")) el.textContent = n + steps[i][2];
          else if (long) el.textContent = long.format(-n, steps[i][0]);
          return;
        }
      }
    });
  }
  refresh();
  setInterval(refresh, 60000);
})();
</script>
<script>
// Mark headlines published since this browser last opened the page.
(function () {
  var last = 0;
  try { last = Number(localStorage.getItem("rollcorn-last-visit")) || 0; } catch (e) {}
  if (last) {
    document.querySelectorAll(".story, .brief").forEach(function (el) {
      var t = el.querySelector("time[datetime]");
      if (t && new Date(t.dateTime).getTime() > last) el.classList.add("is-new");
    });
  }
  // Remember this visit once the reader has had a moment with the page.
  setTimeout(function () {
    try { localStorage.setItem("rollcorn-last-visit", String(Date.now())); } catch (e) {}
  }, 4000);
})();
</script>
<script>
// The corn wheels roll as the page scrolls.
(function () {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var root = document.documentElement, queued = false;
  function roll() {
    queued = false;
    root.style.setProperty("--roll", (window.scrollY * 0.45).toFixed(1) + "deg");
  }
  window.addEventListener("scroll", function () {
    if (!queued) { queued = true; requestAnimationFrame(roll); }
  }, { passive: true });
  roll();
})();
</script>
</body>
</html>
