<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}/{{path}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}/{{path}}">
<meta property="og:image" content="{{url}}/share.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFCD00">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v={{css}}">
</head>
<body id="top">
<a class="skip" href="{{skip_href}}">{{skip_text}}</a>

<!-- The logo's O: an ear of corn with its husk rolled around it into a wheel. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="kernels" width="12.6" height="21" patternUnits="userSpaceOnUse" x="-6.3" y="-44">
      <rect x="1.1" y="1.1" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
      <rect x="-5.2" y="11.6" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
      <rect x="7.4" y="11.6" width="10.4" height="8.3" rx="3.4" fill="#FFCD00"/>
    </pattern>
    <symbol id="ear" viewBox="0 0 120 120">
      <path d="M39 103 L31 115" stroke="#000" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(62 58) rotate(30)">
        <path d="M0 -43 C12 -43 19.5 -23 19.5 2 C19.5 26 13 42 0 42 C-13 42 -19.5 26 -19.5 2 C-19.5 -23 -12 -43 0 -43Z" fill="#000"/>
        <path d="M0 -43 C12 -43 19.5 -23 19.5 2 C19.5 26 13 42 0 42 C-13 42 -19.5 26 -19.5 2 C-19.5 -23 -12 -43 0 -43Z" fill="url(#kernels)" stroke="#000" stroke-width="4.5"/>
      </g>
      <g stroke="#000" stroke-width="4.5" stroke-linejoin="round">
        <path d="M32 108.5 A56 56 0 0 0 112.6 40.8 A59.6 59.6 0 0 1 45.8 95.2Z" fill="#22753A"/>
        <path d="M40.8 112.6 A56 56 0 1 1 88 11.5 A50.3 50.3 0 0 0 37.1 92.8Z" fill="#3FA34D"/>
      </g>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="top-inner">
    <h1 class="wordmark" aria-label="{{name}}"><a class="wordmark-link" href="{{home}}" aria-hidden="true" tabindex="-1"><span class="word">R<svg class="ear" viewBox="0 0 120 120"><use href="#ear"/></svg>LL</span> <span class="word">C<svg class="ear" viewBox="0 0 120 120"><use href="#ear"/></svg>RN</span></a></h1>
    <p class="tagline">{{tagline}}</p>
    {{aside}}
    {{search}}
  </div>
</header>

<nav class="jump" aria-label="Sections">
  <div class="jump-inner">
    <a class="jump-home" href="{{home}}" aria-label="{{home_label}}"><svg class="ear" viewBox="0 0 120 120" aria-hidden="true"><use href="#ear"/></svg></a>
    <div class="jump-sports">{{nav}}</div>
    <a class="jump-merch jump-play" href="hang-time.html"{{game_current}}>Play</a>
    <a class="jump-merch" href="merch.html"{{merch_current}}>Merch</a>
  </div>
</nav>

{{main}}

<a class="totop" href="#top" aria-label="Back to top">Top</a>

<footer class="foot">
{{footer}}
</footer>

<script>
// Times: "3 hours ago" under headlines, "3h" in the Just in column.
(function () {
  var long = window.Intl && Intl.RelativeTimeFormat
    ? new Intl.RelativeTimeFormat("en", { numeric: "auto" }) : null;
  var steps = [["day", 86400, "d"], ["hour", 3600, "h"], ["minute", 60, "m"]];
  function refresh() {
    document.querySelectorAll("time[datetime]").forEach(function (el) {
      var secs = (Date.now() - new Date(el.dateTime)) / 1000;
      if (!el.title) el.title = el.textContent;
      for (var i = 0; i < steps.length; i++) {
        if (secs >= steps[i][1] || i === steps.length - 1) {
          var n = Math.max(0, Math.round(secs / steps[i][1]));
          if (el.hasAttribute("data-short")) el.textContent = n + steps[i][2];
          else if (long) el.textContent = long.format(-n, steps[i][0]);
          return;
        }
      }
    });
  }
  refresh();
  setInterval(refresh, 60000);
})();
</script>
<script>
// Mark headlines published since this browser last opened the page.
(function () {
  var last = 0;
  try { last = Number(localStorage.getItem("rollcorn-last-visit")) || 0; } catch (e) {}
  if (last) {
    document.querySelectorAll(".story, .brief").forEach(function (el) {
      var t = el.querySelector("time[datetime]");
      if (t && new Date(t.dateTime).getTime() > last) el.classList.add("is-new");
    });
  }
  // Remember this visit once the reader has had a moment with the page.
  setTimeout(function () {
    try { localStorage.setItem("rollcorn-last-visit", String(Date.now())); } catch (e) {}
  }, 4000);
})();
</script>
<script>
// Finding things: a sport filter on the headline list, "show more" in each sport, and a search across the page.
(function () {
  var briefs = [].slice.call(document.querySelectorAll(".brief")), chips = [].slice.call(document.querySelectorAll(".chip")), sport = "";
  function list() {                                   // ten headlines, from the chosen sport
    var n = 0;
    briefs.forEach(function (b) { b.hidden = !((!sport || b.getAttribute("data-sport") === sport) && n++ < 10); });
  }
  chips.forEach(function (c) {
    c.addEventListener("click", function () {
      sport = c.getAttribute("data-sport");
      chips.forEach(function (o) { var on = o === c; o.classList.toggle("is-on", on); o.setAttribute("aria-pressed", on ? "true" : "false"); });
      list();
    });
  });
  document.querySelectorAll(".more-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.parentNode.querySelectorAll("[data-more]").forEach(function (el) { el.hidden = false; });
      btn.remove();
    });
  });
  var q = document.getElementById("q"), status = document.getElementById("search-status");
  if (q) {
    var all = [].slice.call(document.querySelectorAll("main .story, main .brief"));
    all.forEach(function (el) { el.setAttribute("data-was", el.hidden ? "1" : ""); });
    q.addEventListener("input", function () {
      var term = q.value.trim().toLowerCase(), hits = 0, seen = {};
      document.body.classList.toggle("is-searching", !!term);
      all.forEach(function (el) {
        if (!term) { el.hidden = !!el.getAttribute("data-was"); return; }
        var a = el.querySelector("a"), ok = el.textContent.toLowerCase().indexOf(term) >= 0 && a && !seen[a.href] && !el.closest(".justin");
        if (ok) { seen[a.href] = 1; hits++; }
        el.hidden = !ok;
      });
      document.querySelectorAll(".plot").forEach(function (p) { p.hidden = !!term && !p.querySelector(".story:not([hidden])"); });
      if (!term) list();
      status.hidden = !term;
      status.textContent = term ? (hits ? hits + (hits === 1 ? " headline matches \u201C" : " headlines match \u201C") + q.value.trim() + "\u201D" : "No headlines match \u201C" + q.value.trim() + "\u201D. Try a name or a team.") : "";
    });
  }
  var top = document.querySelector(".totop");
  if (top) window.addEventListener("scroll", function () { top.classList.toggle("is-up", window.scrollY > 900); }, { passive: true });
})();
</script>
<script>
// Game times in the reader's own time zone.
(function () {
  if (!window.Intl) return;
  var day = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" });
  var hour = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
  document.querySelectorAll("[data-kick]").forEach(function (el) {
    var d = new Date(el.getAttribute("data-kick"));
    if (!isNaN(d)) el.textContent = day.format(d) + " \u00B7 " + hour.format(d);
  });
})();
</script>
<script>
// The sport bar shows where the reader is: the section in view is lit, and kept in sight in the bar.
(function () {
  if (!("IntersectionObserver" in window)) return;
  var links = {}, bar = document.querySelector(".jump-sports");
  document.querySelectorAll(".jump-sports a").forEach(function (a) {
    var id = (a.getAttribute("href") || "").split("#")[1];
    if (id && a.getAttribute("href").charAt(0) === "#") links[id] = a;
  });
  var seen = {};
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { seen[e.target.id] = e.isIntersecting; });
    var here = "";
    Object.keys(links).forEach(function (id) { if (seen[id] && !here) here = id; });
    Object.keys(links).forEach(function (id) { links[id].classList.toggle("is-here", id === here); });
    if (here && bar) {
      var a = links[here], left = a.offsetLeft - bar.offsetLeft;
      if (left < bar.scrollLeft || left + a.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollTo({ left: Math.max(0, left - 24), behavior: "smooth" });
    }
  }, { rootMargin: "-25% 0px -60% 0px" });
  Object.keys(links).forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
})();
</script>
<script>
// The corn wheels roll as the page scrolls.
(function () {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var root = document.documentElement, queued = false;
  function roll() {
    queued = false;
    root.style.setProperty("--roll", (window.scrollY * 0.45).toFixed(1) + "deg");
  }
  window.addEventListener("scroll", function () {
    if (!queued) { queued = true; requestAnimationFrame(roll); }
  }, { passive: true });
  roll();
})();
</script>
</body>
</html>
